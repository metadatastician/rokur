# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Trimmed to the ecosystems this repo actually uses.
#
# Rokur is a Bun project. Dependabot has a dedicated `bun` ecosystem for the
# `package.json` + text `bun.lock` pair; using the npm ecosystem invokes the
# npm-and-yarn updater instead and cannot maintain Bun's lockfile.
#
# (The RSR template also ships cargo/mix/pip/nix as examples — none have a
# matching manifest in this repo, so declaring them would only produce red
# "Dependabot Updates" runs against non-existent manifests.)

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Bun - reads package.json + bun.lock (Bun's lockfile is text in 1.4.x)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      bun:
        patterns:
          - "*"
