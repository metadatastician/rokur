# Dependabot configuration for RSR-compliant repositories
# Trimmed to the ecosystems this repo actually uses. rokur is a Deno project;
# Dependabot has no Deno ecosystem, so only GitHub Actions is managed here.
# (The RSR template ships cargo/mix/npm/pip/nix as examples — none have a
# matching manifest in this repo, so declaring them only produced red
# "Dependabot Updates" runs against non-existent manifests.)

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
