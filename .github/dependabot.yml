# Dependabot configuration for RSR-compliant repositories
# Trimmed to the ecosystems this repo actually uses.
#
# rokur was a Deno project, which Dependabot has no ecosystem for, so only
# GitHub Actions was managed here. Since the move to bun the repo has a real
# `package.json` + `bun.lock`, which Dependabot reads through its npm
# ecosystem — so npm is declared now that a manifest actually backs it.
#
# (The RSR template also ships cargo/mix/pip/nix as examples — none have a
# matching manifest in this repo, so declaring them would only produce red
# "Dependabot Updates" runs against non-existent manifests.)

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # npm - reads package.json + bun.lock (bun's lockfile is text in 1.4.x)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
