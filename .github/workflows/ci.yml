# SPDX-License-Identifier: MPL-2.0
name: CI
# rokur's test + build gate, on bun.
#
# Two jobs, both GATES. Every step must be able to fail the job: no
# `continue-on-error`, no `|| true`, no `|| echo`.
#
#   test   -- runs the suite AND asserts how many tests ran.
#   image  -- builds the Containerfile, runs it, and probes it.
#
# The count assertion in `test` is load-bearing, not belt-and-braces. Measured
# on bun 1.4.1: when test FILES match the glob but register ZERO tests, bun
# prints `0 pass / 0 fail` and exits **0**. That is the exact failure mode of
# this repo's deno->bun migration, so `rc=0` alone cannot protect the suite.
# Only a count at or above a known floor can.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# No workflow-level grants. A job-level block REPLACES this one rather than
# adding to it, so each job below carries its own `contents: read`.
permissions: {}
jobs:
  test:
    name: test (with a test-count floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The measured count on the commit that introduced this gate. Raise it
      # when tests are added; a DROP below it fails the build on purpose.
      ROKUR_TEST_FLOOR: 66
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the suite
        id: suite
        # Captured by redirection, not a pipe: a pipe would hand this step the
        # exit status of the last command in the pipeline instead of bun's.
        run: |
          set -u
          bun test > bun-test.out 2>&1 && rc=0 || rc=$?
          cat bun-test.out
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Assert the test count did not collapse
        # `always()` so this still runs when the suite fails: a collapse to zero
        # registrations is exactly the case where the count is most informative.
        if: always()
        run: |
          set -u
          if [ ! -f bun-test.out ]; then
            echo "::error title=test count::no bun test output was captured; refusing to pass."
            exit 1
          fi
          # Strip ANSI colour before parsing -- bun colourises this line.
          count=$(
            sed -e 's/\x1b\[[0-9;]*m//g' bun-test.out \
              | sed -n 's/^Ran \([0-9][0-9]*\) tests.*/\1/p' \
              | tail -1
          )
          if [ -z "$count" ]; then
            echo "::error title=test count::could not parse 'Ran N tests' from the output; failing closed rather than assuming a pass."
            exit 1
          fi
          echo "registered tests: $count (floor ${ROKUR_TEST_FLOOR})"
          if [ "$count" -lt "$ROKUR_TEST_FLOOR" ]; then
            echo "::error title=test count::only ${count} tests ran, floor is ${ROKUR_TEST_FLOOR}. A silent drop in registrations is the migration's main risk; bun exits 0 when a test file registers nothing."
            exit 1
          fi

  image:
    name: build + run + probe the container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        # --no-cache is deliberate: a cached layer produced a FALSE GREEN for
        # this Containerfile before. A stage printing no STEP lines is a cache
        # hit, not a success.
        run: podman build --no-cache -t rokur:ci -f Containerfile .
      - name: Run it, and probe both endpoints
        run: |
          set -eu
          # Readiness is configured to SUCCEED here: the one required secret is
          # supplied, so /ready must be 200.
          podman run -d --name rokur-ci -p 17658:7658 \
            -e ROKUR_ENV=development \
            -e ROKUR_API_TOKEN=ci-token-$RANDOM$RANDOM \
            -e ROKUR_REQUIRED_SECRETS=panic_profile \
            -e ROKUR_SECRET_PANIC_PROFILE=enabled \
            rokur:ci
          # Probe from the HOST, so this tests the published port and the bind
          # address together, not just in-container loopback.
          curl --retry 30 --retry-delay 1 --retry-connrefused -fsS \
            -o /dev/null http://127.0.0.1:17658/health
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17658/health)
          ready=$(curl  -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17658/ready)
          echo "/health=$health /ready=$ready"
          [ "$health" = "200" ] || { echo "::error::/health returned $health, expected 200"; podman logs rokur-ci; exit 1; }
          [ "$ready"  = "200" ] || { echo "::error::/ready returned $ready, expected 200 when required secrets are present"; podman logs rokur-ci; exit 1; }
          podman rm -f rokur-ci
      - name: Prove readiness can actually FAIL
        run: |
          set -eu
          # Same image, required secret DELIBERATELY absent. A readiness probe
          # that can only ever return 200 is not a probe, so this asserts the
          # red path as well as the green one.
          podman run -d --name rokur-ci-notready -p 17659:7658 \
            -e ROKUR_ENV=development \
            -e ROKUR_API_TOKEN=ci-token-$RANDOM$RANDOM \
            -e ROKUR_REQUIRED_SECRETS=panic_profile \
            rokur:ci
          curl --retry 30 --retry-delay 1 --retry-connrefused -fsS \
            -o /dev/null http://127.0.0.1:17659/health
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17659/health)
          ready=$(curl  -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17659/ready)
          echo "with the required secret missing: /health=$health /ready=$ready"
          # Liveness must NOT follow readiness down: /health answers "is this
          # process alive?", which it is.
          [ "$health" = "200" ] || { echo "::error::/health returned $health; liveness must not track readiness"; exit 1; }
          [ "$ready"  = "503" ] || { echo "::error::/ready returned $ready, expected 503 REQUIRED_SECRETS_MISSING"; podman logs rokur-ci-notready; exit 1; }
          podman rm -f rokur-ci-notready
