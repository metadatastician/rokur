# SPDX-License-Identifier: MPL-2.0
name: Hypatia Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# The reusable scanner uploads its filtered SARIF and can optionally inspect
# workflow artifacts. Grant only the scopes it declares; do not inherit the
# caller's secrets or permissions.
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  scan:
    # Pin the reusable workflow to the revision already used by Rokur's
    # secret-scanner wrapper. The standards repository records all nested
    # action pins in its central actions.lock at this revision.
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
    with:
      # Hypatia reports high/critical findings without turning its advisory
      # scanner into a release gate for this repository.
      block-on-high: false
      # This repository has no fleet report-back producer in this run.
      report-backs-artifact: ""
      previous-grid-artifact: ""
    # Deliberately no `secrets: inherit`: the reusable scanner accepts only an
    # optional explicit HYPATIA_SCAN_PAT and falls back to GITHUB_TOKEN.
