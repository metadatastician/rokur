# SPDX-License-Identifier: MPL-2.0
name: GitHub Pages (Ddraig SSG)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
# The workflow-level permissions block moved to the two jobs below. A job-level
# block REPLACES the workflow-level one rather than adding to it, so each job
# carries the SAME four grants it had before -- byte-identical, deliberately not
# split per job. Narrowing them is not attempted here: this workflow is
# `push`/`workflow_dispatch` only, so no pull request can exercise the change.
# (Sonar githubactions:S8264 read-at-workflow-level, S8233 write-at-workflow-level.)
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout Site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Ddraig SSG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/ddraig-ssg
          path: .ddraig-ssg
      - name: Compile Ddraig
        working-directory: .ddraig-ssg
        run: idris2 Ddraig.idr -o ddraig
      - name: Build site
        run: |
          mkdir -p src
          if [ ! -f src/index.md ] && [ -f README.md ]; then
            cp README.md src/index.md
          elif [ ! -f src/index.md ]; then
            echo "# ${GITHUB_REPOSITORY}" > src/index.md
          fi
          ./.ddraig-ssg/build/exec/ddraig build src _site https://hyperpolymath.github.io/${GITHUB_REPOSITORY#*/}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
