# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# This caller deliberately forwards no repository or organisation secrets. The
# pinned reusable workflow declares no workflow_call secrets and does not use
# the secrets context; contents: read is the only scope its scanner jobs need.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@8ff9ce65f7e54f8d5c5aa94584e2ead0f2ba460f
