#
# Repository settings for probot/settings GitHub App.
# https://github.com/probot/settings
#
# This file defines repository-level configuration that is automatically
# applied by the probot/settings app when changes are pushed to the default
# branch. Install the app at: https://github.com/apps/settings
#
# Repository settings — configured for rokur.
#
# Labels are managed by .github/labels.json and its Labels workflow. Branch
# and tag governance is intentionally absent here: active organisation rulesets
# are the sole authoritative policy source for those protections.

repository:
  name: "rokur"
  description: "Secrets and authorization gate for Stapeln container starts: checks required secrets, evaluates allow/deny policy, and records decisions without exposing secret names."
  # An empty homepage value clears the field; rokur deliberately has no homepage.
  homepage: ""
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
